version: '3'

vars:
  PROJECT_ROOT:
    sh: pwd
  GOBIN: '{{.PROJECT_ROOT}}/bin'
  GOLANGCI_LINT_BINARY: '{{.GOBIN}}/golangci-lint'
  GOVULNCHECK_BINARY: '{{.GOBIN}}/govulncheck'
  REQUIRED_GOLANGCI_LINT_VERSION:
    sh: cat .golangci.version 2>/dev/null || echo "2.9.0"
  REQUIRED_GOVULNCHECK_VERSION:
    sh: cat .govulncheck.version 2>/dev/null || echo "1.3.0"
  GOLANGCI_LINT_VERSION:
    sh: >-
      {{.GOLANGCI_LINT_BINARY}} version --format short 2>/dev/null ||
      {{.GOLANGCI_LINT_BINARY}} version --short 2>/dev/null ||
      echo "not-installed"
  GOVULNCHECK_VERSION:
    sh: >-
      {{.GOVULNCHECK_BINARY}} -version 2>/dev/null |
      sed -n 's/^Scanner: govulncheck@v//p' |
      head -n1 ||
      echo "not-installed"

env:
  GOBIN: '{{.GOBIN}}'

tasks:
  default:
    desc: Run lint and test
    cmds:
      - task: lint
      - task: test

  help:
    desc: Show this help message
    cmds:
      - echo "go-humanize"
      - echo "Available targets:"
      - task --list
    silent: true

  clean:
    desc: Clean build artifacts and caches
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf {{.GOBIN}}
      - go clean -cache -testcache || true

  deps:
    desc: Download Go module dependencies
    cmds:
      - echo "Downloading dependencies..."
      - go mod download
      - go mod tidy


  deps:update:
    desc: Update all dependencies
    cmds:
      - echo "Updating dependencies..."
      - go get -u ./... && go mod tidy

  test:
    desc: Run all tests with race detection
    cmds:
      - echo "Running all tests..."
      - go test -race -p 1 ./...

  bench:
    desc: Run benchmark baseline
    cmds:
      - echo "Running benchmarks..."
      - go test -run=^$ -bench=. -benchmem ./...

  lint:
    desc: Run all linters
    cmds:
      - task: tidy-lint
      - task: golangci-lint

  install-golangci-lint:
    desc: Install golangci-lint with the required version
    cmds:
      - mkdir -p {{.GOBIN}}
      - |
        if [ "{{.GOLANGCI_LINT_VERSION}}" != "{{.REQUIRED_GOLANGCI_LINT_VERSION}}" ]; then
          echo "Installing golangci-lint v{{.REQUIRED_GOLANGCI_LINT_VERSION}} (current: {{.GOLANGCI_LINT_VERSION}})..."
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
            | sh -s -- -b {{.GOBIN}} v{{.REQUIRED_GOLANGCI_LINT_VERSION}}
          echo "golangci-lint v{{.REQUIRED_GOLANGCI_LINT_VERSION}} installed successfully"
        fi
    status:
      - test "{{.GOLANGCI_LINT_VERSION}}" = "{{.REQUIRED_GOLANGCI_LINT_VERSION}}"

  golangci-lint:
    desc: Run golangci-lint
    deps:
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT_BINARY}} version'
      - echo "Running golangci-lint..."
      - '{{.GOLANGCI_LINT_BINARY}} run --allow-parallel-runners --timeout=10m --path-prefix .'

  tidy-lint:
    desc: Check if go.mod and go.sum are tidy
    cmds:
      - echo "Checking go.mod and go.sum are tidy..."
      - go mod tidy -diff

  yamllint:
    desc: Run yamllint
    cmds:
      - yamllint -s .

  install-govulncheck:
    desc: Install govulncheck with the required version
    cmds:
      - mkdir -p {{.GOBIN}}
      - |
        if [ "{{.GOVULNCHECK_VERSION}}" != "{{.REQUIRED_GOVULNCHECK_VERSION}}" ]; then
          echo "Installing govulncheck v{{.REQUIRED_GOVULNCHECK_VERSION}} (current: {{.GOVULNCHECK_VERSION}})..."
          go install golang.org/x/vuln/cmd/govulncheck@v{{.REQUIRED_GOVULNCHECK_VERSION}}
          echo "govulncheck v{{.REQUIRED_GOVULNCHECK_VERSION}} installed successfully"
        fi
    status:
      - test "{{.GOVULNCHECK_VERSION}}" = "{{.REQUIRED_GOVULNCHECK_VERSION}}"

  vuln:
    desc: Run govulncheck
    deps:
      - install-govulncheck
    cmds:
      - '{{.GOVULNCHECK_BINARY}} ./...'

  fmt:
    desc: Format Go code
    cmds:
      - echo "Formatting Go code..."
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - echo "Running go vet..."
      - go vet ./...

  verify:
    desc: Run all verification steps (deps, format, vet, lint, test, vuln)
    cmds:
      - task: deps
      - task: fmt
      - task: vet
      - task: lint
      - task: test
      - task: vuln
      - echo "All verification steps completed successfully ✅"
